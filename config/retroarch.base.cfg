# retroarch-mac-setup — managed keys.
# setup.sh merges these keys into ~/Library/Application Support/RetroArch/config/retroarch.cfg.
# Keys not listed here are left untouched. {{PLACEHOLDERS}} are filled in by the script.
# Every key was checked against RetroArch v1.22.2 (configuration.c / config.def.h).

# ---------- Video ----------
# Vulkan via MoltenVK (bundled in the Metal build). Never "metal". Per-core glcore fallbacks live in config/<core>/<core>.cfg
video_driver = "vulkan"
video_fullscreen = "true"
video_windowed_fullscreen = "true"
video_vsync = "true"
video_smooth = "false"
# Integer scaling on the vertical axis only: scanlines stay perfectly even and the horizontal
# axis follows the aspect ratio below, so nothing is stretched.
video_scale_integer = "true"
video_scale_integer_axis = "0"
video_scale_integer_scaling = "0"
# 22 = ASPECT_RATIO_CORE (gfx/video_defines.h: 4_3=0 ... CONFIG=20, SQUARE=21, CORE=22, CUSTOM=23, FULL=24).
# Arcade and handhelds use the aspect the core reports (MAME 4:3 or 3:4 vertical, GBA 3:2, GB 10:9).
# TV consoles get 4:3 from a per-folder override written by the script (config/<core>/<folder>.cfg).
aspect_ratio_index = "22"
# Lets MAME/FBNeo rotate vertical games (TATE) to their native orientation
video_allow_rotate = "true"
video_shader_enable = "true"
auto_shaders_enable = "true"
video_shader_dir = "{{RA_HOME}}/shaders"
video_font_path = "{{FONT}}"

# ---------- Menu ----------
# Ozone is the default macOS driver and it accepts a custom TTF through ozone_font
menu_driver = "ozone"
ozone_font = "{{FONT}}"
# Thumbnails: 1 = Named_Snaps (gameplay). Left/icon thumbnails disabled (no boxarts/titles)
menu_thumbnails = "1"
menu_left_thumbnails = "0"
menu_icon_thumbnails = "0"
network_on_demand_thumbnails = "false"
thumbnails_directory = "{{CACHE}}/thumbnails/normalized"
playlist_directory = "{{RA_HOME}}/playlists"
playlist_sort_alphabetical = "true"
pause_nonactive = "false"
config_save_on_exit = "true"

# ---------- Paths (kept on the external disk so they survive a reformat) ----------
system_directory = "{{BIOS}}"
savefile_directory = "{{SAVES}}/saves"
savestate_directory = "{{SAVES}}/states"
screenshot_directory = "{{SAVES}}/screenshots"
libretro_directory = "{{RA_HOME}}/cores"
libretro_info_path = "{{RA_HOME}}/info"
joypad_autoconfig_dir = "{{RA_HOME}}/autoconfig"
global_core_options = "false"
auto_overrides_enable = "true"
# Per-folder / per-game button remaps (MAME fighting-game layouts), config/remaps/<core>/
auto_remaps_enable = "true"
# Do not re-save the active remap when a game closes: it would overwrite the managed layouts.
# Save your own from Quick Menu -> Controls -> Manage Remap Files instead.
remap_save_on_exit = "false"

# ---------- Input: mfi driver (any pad macOS supports; profile chosen by setup.sh) ----------
# Raw mfi indices follow Apple's button labels, the same on every pad:
#   A=0 X=1 Select=2 Start=3 Up=4 Down=5 Left=6 Right=7 B=8 Y=9
#   L=10 R=11 L2=12 R2=13 L3=14 R3=15 Home=16
# Hotkeys use these raw indices, so "L2 + A" below means the button printed A on the SN30 Pro
# and on Xbox pads (Cross on PlayStation: A=Cross B=Circle X=Square Y=Triangle).
input_joypad_driver = "mfi"
input_autodetect_enable = "true"
input_max_users = "4"
# Hotkey enable = L2. Every shortcut is L2 + button; while L2 is held the game gets no input,
# so nothing leaks into the game. (Side effect: games cannot use L2 themselves — only a few
# PlayStation games do.)
input_enable_hotkey_btn = "12"
# L2+Start = menu (in game and to close the menu again). This bind replaces the Home button
# of the autoconfig profile (macOS may also claim Home for its own game overlay).
# The Select+Start combo is off, so Coin+Start in arcade games never opens the menu by accident.
input_menu_toggle_btn = "3"
input_menu_toggle_gamepad_combo = "0"
# L2+R2 (hold) = fast forward
input_hold_fast_forward_btn = "13"
# L2+R1 = save state, L2+L1 = load state, L2+Right/Left = state slot +/-
input_save_state_btn = "11"
input_load_state_btn = "10"
input_state_slot_increase_btn = "7"
input_state_slot_decrease_btn = "6"
# L2+Select = close the game (back to the game list)
input_close_content_btn = "2"
# L2+X twice = quit RetroArch
input_exit_emulator_btn = "1"
# L2+A = pause, L2+Y = screenshot, L2+Up = CRT/LCD shader on/off (compare), L2+Down = reset game
input_pause_toggle_btn = "0"
input_screenshot_btn = "9"
input_shader_toggle_btn = "4"
input_reset_btn = "5"
# Exit needs two presses so it can't happen by accident
quit_press_twice = "true"
notification_show_autoconfig = "true"
