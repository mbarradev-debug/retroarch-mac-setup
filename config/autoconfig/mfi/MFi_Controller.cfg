# 8BitDo SN30 Pro — Bluetooth, macOS mode (power on with START + A, pairs as "Wireless Controller").
# RetroArch's macOS "mfi" driver exposes every GameController-framework pad as "mFi Controller".
# Its raw indices follow Apple's *labels*: buttonA=0, buttonB=8, buttonX=1, buttonY=9.
# The SN30 Pro reports its buttons by the letter printed on them (Nintendo layout: A right,
# B bottom, Y left, X top), so the stock profile — written for Xbox-style pads where A is the
# bottom button — swaps A/B and X/Y. This profile maps each printed letter to the RetroPad
# button with the same letter, which is also the SNES pad's layout:
#   B (bottom) = RetroPad B   A (right) = RetroPad A   Y (left) = RetroPad Y   X (top) = RetroPad X
# SNES: B jumps, Y runs, exactly as on the original pad.
input_driver = "mfi"
input_device = "mFi Controller"
input_b_btn = "8"
input_y_btn = "9"
input_select_btn = "2"
input_start_btn = "3"
input_up_btn = "4"
input_down_btn = "5"
input_left_btn = "6"
input_right_btn = "7"
input_a_btn = "0"
input_x_btn = "1"
input_l_btn = "10"
input_r_btn = "11"
input_l3_btn = "14"
input_r3_btn = "15"
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "-1"
input_l_y_minus_axis = "+1"
input_r_x_plus_axis = "+2"
input_r_x_minus_axis = "-2"
input_r_y_plus_axis = "-3"
input_r_y_minus_axis = "+3"
input_l2_axis = "+4"
input_r2_axis = "+5"
input_menu_toggle_btn = "16"
